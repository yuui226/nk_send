:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

            &lt;span id=&quot;zt-list-title&quot; class=&quot;zt-category-name&quot;&gt;推荐集合&lt;/span&gt;
            &lt;span id=&quot;zt-list-count&quot; class=&quot;zt-category-count&quot;&gt;16/16&lt;/span&gt;
          &lt;/label&gt;
          &lt;div id=&quot;zt-filter-list&quot;&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;div class=&quot;zt-actionbar&quot;&gt;
          &lt;button id=&quot;zt-reset-recommended&quot; class=&quot;zt-secondary-button&quot; type=&quot;button&quot;&gt;恢复推荐&lt;/button&gt;
          &lt;button id=&quot;zt-apply-manager&quot; class=&quot;zt-primary-button&quot; type=&quot;button&quot;&gt;完成并应用&lt;/button&gt;
        &lt;/div&gt;
        &lt;p class=&quot;zt-bottom-note&quot;&gt;隐藏只影响选择列表，不会删除滤镜&lt;/p&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;zt-filter-management-demo&quot;);
      const categoryNames = [&quot;推荐&quot;, &quot;人像与柔光&quot;, &quot;电影与胶片&quot;, &quot;自然与绿意&quot;, &quot;蓝调与冷色&quot;, &quot;暖调与日落&quot;, &quot;创意负片&quot;];
      const recommendedNames = new Set([
        &quot;森屿青&quot;, &quot;暮色余温&quot;, &quot;英伦黑白&quot;, &quot;电影蓝&quot;, &quot;清透人像&quot;, &quot;暖秋&quot;, &quot;经典胶片&quot;, &quot;金色黄昏&quot;,
        &quot;柔暖人像&quot;, &quot;粉彩柔光&quot;, &quot;濑户蓝&quot;, &quot;天空薄雾&quot;, &quot;柔光&quot;, &quot;暖阳亲吻&quot;, &quot;青橙电影&quot;, &quot;暖调人像&quot;
      ]);
      const data = [
        [&quot;森屿青&quot;, &quot;自然与绿意&quot;], [&quot;暮色余温&quot;, &quot;暖调与日落&quot;], [&quot;漂白银盐&quot;, &quot;电影与胶片&quot;],
        [&quot;蓝调时刻&quot;, &quot;蓝调与冷色&quot;], [&quot;蓝色记忆&quot;, &quot;蓝调与冷色&quot;], [&quot;英伦黑白&quot;, &quot;电影与胶片&quot;],
        [&quot;恋爱柔光&quot;, &quot;人像与柔光&quot;], [&quot;静谧微风&quot;, &quot;自然与绿意&quot;], [&quot;电影蓝&quot;, &quot;电影与胶片&quot;],
        [&quot;电影暮影&quot;, &quot;电影与胶片&quot;], [&quot;清透人像&quot;, &quot;人像与柔光&quot;], [&quot;暖秋&quot;, &quot;暖调与日落&quot;],
        [&quot;晨曦&quot;, &quot;自然与绿意&quot;], [&quot;暗房胶片&quot;, &quot;电影与胶片&quot;], [&quot;蕨影&quot;, &quot;自然与绿意&quot;],
        [&quot;经典胶片&quot;, &quot;电影与胶片&quot;], [&quot;金色黄昏&quot;, &quot;暖调与日落&quot;], [&quot;和煦&quot;, &quot;人像与柔光&quot;],
        [&quot;城市绿意&quot;, &quot;自然与绿意&quot;], [&quot;雾蓝哑光&quot;, &quot;蓝调与冷色&quot;], [&quot;苔绿情绪&quot;, &quot;自然与绿意&quot;],
        [&quot;墨绿暗影&quot;, &quot;自然与绿意&quot;], [&quot;柔暖人像&quot;, &quot;人像与柔光&quot;], [&quot;自然联结&quot;, &quot;自然与绿意&quot;],
        [&quot;青色负片&quot;, &quot;创意负片&quot;], [&quot;红青负片&quot;, &quot;创意负片&quot;], [&quot;茶青负片&quot;, &quot;创意负片&quot;],
        [&quot;柠黄负片&quot;, &quot;创意负片&quot;], [&quot;琥珀负片&quot;, &quot;创意负片&quot;], [&quot;黄绿负片&quot;, &quot;创意负片&quot;],
        [&quot;粉彩柔光&quot;, &quot;人像与柔光&quot;], [&quot;玫瑰旧片&quot;, &quot;电影与胶片&quot;], [&quot;濑户蓝&quot;, &quot;蓝调与冷色&quot;],
        [&quot;天空薄雾&quot;, &quot;蓝调与冷色&quot;], [&quot;轻柔胶片&quot;, &quot;人像与柔光&quot;], [&quot;柔光&quot;, &quot;人像与柔光&quot;],
        [&quot;冷调日吻&quot;, &quot;蓝调与冷色&quot;], [&quot;暖阳亲吻&quot;, &quot;暖调与日落&quot;], [&quot;落日胶片&quot;, &quot;电影与胶片&quot;],
        [&quot;夕照柔光&quot;, &quot;暖调与日落&quot;], [&quot;青橙电影&quot;, &quot;电影与胶片&quot;], [&quot;清柔&quot;, &quot;人像与柔光&quot;],
        [&quot;松石蓝&quot;, &quot;蓝调与冷色&quot;], [&quot;旧日色彩&quot;, &quot;电影与胶片&quot;], [&quot;复古活力&quot;, &quot;暖调与日落&quot;],
        [&quot;鲜活胶片&quot;, &quot;电影与胶片&quot;], [&quot;暖街&quot;, &quot;暖调与日落&quot;], [&quot;暖夜微光&quot;, &quot;暖调与日落&quot;],
        [&quot;暖调人像&quot;, &quot;人像与柔光&quot;], [&quot;蜜糖暖调&quot;, &quot;人像与柔光&quot;]
      ].map(([name, category]) =&gt; ({ name, category, recommended: recommendedNames.has(name) }));

      let appliedVisible = new Set(recommendedNames);
      let draftVisible = new Set(appliedVisible);
      let selectedName = &quot;电影蓝&quot;;
      let activeCategory = &quot;推荐&quot;;
      let statusFilter = &quot;all&quot;;

      const workbench = root.querySelector(&quot;#zt-workbench-screen&quot;);
      const manager = root.querySelector(&quot;#zt-manager-screen&quot;);
      const filterWheel = root.querySelector(&quot;#zt-filter-wheel&quot;);
      const filterList = root.querySelector(&quot;#zt-filter-list&quot;);
      const search = root.querySelector(&quot;#zt-search&quot;);
      const groupCheckbox = root.querySelector(&quot;#zt-group-checkbox&quot;);

      function filtersForCategory() {
        const query = search.value.trim().toLowerCase();
        return data.filter((item) =&gt; {
          const categoryMatch = activeCategory === &quot;推荐&quot; ? item.recommended : item.category === activeCategory;
          const searchMatch = !query || item.name.toLowerCase().includes(query);
          const visible = draftVisible.has(item.name);
          const statusMatch = statusFilter === &quot;all&quot; ||
            (statusFilter === &quot;visible&quot; &amp;&amp; visible) ||
            (statusFilter === &quot;hidden&quot; &amp;&amp; !visible);
          return categoryMatch &amp;&amp; searchMatch &amp;&amp; statusMatch;
        });
      }

      function baseCategoryFilters() {
        return data.filter((item) =&gt; activeCategory === &quot;推荐&quot; ? item.recommended : item.category === activeCategory);
      }

      function renderWorkbench() {
        const visible = data.filter((item) =&gt; appliedVisible.has(item.name));
        const selectedIsHidden = !appliedVisible.has(selectedName);
        const wheelItems = selectedIsHidden
          ? [{ name: selectedName, hidden: true }, ...visible.filter((item) =&gt; item.name !== selectedName)]
          : visible;
        if (!wheelItems.length) {
          filterWheel.innerHTML =
            &#x27;&lt;div class=&quot;zt-wheel-item&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;zt-wheel-item is-current&quot;&gt;无滤镜&lt;/div&gt;&lt;div class=&quot;zt-wheel-item&quot;&gt;—&lt;/div&gt;&#x27;;
          root.querySelector(&quot;#zt-preview-label&quot;).textContent = &quot;无滤镜&quot;;
        } else {
          const selectedIndex = Math.max(0, wheelItems.findIndex((item) =&gt; item.name === selectedName));
          const previous = wheelItems[(selectedIndex - 1 + wheelItems.length) % wheelItems.length];
          const current = wheelItems[selectedIndex];
          const next = wheelItems[(selectedIndex + 1) % wheelItems.length];
          filterWheel.innerHTML = [previous, current, next].map((item, index) =&gt; {
            const hidden = item.hidden ? &#x27;&lt;span class=&quot;zt-hidden-note&quot;&gt;已隐藏&lt;/span&gt;&#x27; : &quot;&quot;;
            return &#x27;&lt;div class=&quot;zt-wheel-item&#x27; + (index === 1 ? &#x27; is-current&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; +
              item.name + (index === 1 ? hidden : &quot;&quot;) + &#x27;&lt;/div&gt;&#x27;;
          }).join(&quot;&quot;);
          root.querySelector(&quot;#zt-preview-label&quot;).textContent =
            selectedName + (selectedIsHidden ? &quot; · 已隐藏&quot; : &quot;&quot;) + &quot; · 100%&quot;;
        }
        root.querySelector(&quot;#zt-visible-count&quot;).textContent = &quot;显示 &quot; + appliedVisible.size + &quot;/50&quot;;
      }

      function stepFilter(direction) {
        const visible = data.filter((item) =&gt; appliedVisible.has(item.name));
        if (!visible.length) return;
        const currentIndex = visible.findIndex((item) =&gt; item.name === selectedName);
        const start = currentIndex &gt;= 0 ? currentIndex : 0;
        const index = (start + direction + visible.length) % visible.length;
        selectedName = visible[index].name;
        renderWorkbench();
      }

      function renderCategoryChips() {
        const container = root.querySelector(&quot;#zt-category-chips&quot;);
        container.innerHTML = &quot;&quot;;
        categoryNames.forEach((category) =&gt; {
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;zt-chip&quot;;
          button.textContent = category;
          button.setAttribute(&quot;aria-pressed&quot;, String(category === activeCategory));
          button.addEventListener(&quot;click&quot;, () =&gt; {
            activeCategory = category;
            renderManager();
          });
          container.appendChild(button);
        });
      }

      function renderManager() {
        renderCategoryChips();
        root.querySelector(&quot;#zt-manager-count&quot;).textContent = draftVisible.size + &quot;/50&quot;;
        root.querySelector(&quot;#zt-list-title&quot;).textContent =
          search.value.trim() ? &quot;搜索结果&quot; : (activeCategory === &quot;推荐&quot; ? &quot;推荐集合&quot; : activeCategory);

        const rows = filtersForCategory();
        const base = baseCategoryFilters();
        const baseVisibleCount = base.filter((item) =&gt; draftVisible.has(item.name)).length;
        root.querySelector(&quot;#zt-list-count&quot;).textContent = baseVisibleCount + &quot;/&quot; + base.length;
        groupCheckbox.checked = base.length &gt; 0 &amp;&amp; baseVisibleCount === base.length;
        groupCheckbox.indeterminate = baseVisibleCount &gt; 0 &amp;&amp; baseVisibleCount &lt; base.length;

        filterList.innerHTML = &quot;&quot;;
        if (!rows.length) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;zt-empty&quot;;
          empty.textContent = &quot;没有符合条件的滤镜&quot;;
          filterList.appendChild(empty);
          return;
        }

        rows.forEach((item, index) =&gt; {
          const label = document.createElement(&quot;label&quot;);
          label.className = &quot;zt-filter-row&quot;;
          const checkbox = document.createElement(&quot;input&quot;);
          checkbox.type = &quot;checkbox&quot;;
          checkbox.checked = draftVisible.has(item.name);
          checkbox.setAttribute(&quot;aria-label&quot;, &quot;显示&quot; + item.name);
          checkbox.addEventListener(&quot;change&quot;, () =&gt; {
            if (checkbox.checked) draftVisible.add(item.name);
            else draftVisible.delete(item.name);
            renderManager();
          });
          const name = document.createElement(&quot;span&quot;);
          name.className = &quot;zt-filter-name&quot;;
          name.textContent = item.name;
          const category = document.createElement(&quot;span&quot;);
          category.className = &quot;zt-filter-category&quot;;
          category.textContent = item.category;
          label.append(checkbox, name);
          if (activeCategory === &quot;推荐&quot; || search.value.trim()) label.append(category);
          filterList.appendChild(label);
        });
      }

      function openManager() {
        draftVisible = new Set(appliedVisible);
        activeCategory = &quot;推荐&quot;;
        statusFilter = &quot;all&quot;;
        search.value = &quot;&quot;;
        root.querySelectorAll(&quot;.zt-segment&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.status === &quot;all&quot;));
        });
        workbench.hidden = true;
        manager.hidden = false;
        renderManager();
      }

      function closeManager(apply) {
        if (apply) appliedVisible = new Set(draftVisible);
        manager.hidden = true;
        workbench.hidden = false;
        renderWorkbench();
      }

      root.querySelector(&quot;#zt-open-manager&quot;).addEventListener(&quot;click&quot;, openManager);
      root.querySelector(&quot;#zt-manager-back&quot;).addEventListener(&quot;click&quot;, () =&gt; closeManager(false));
      root.querySelector(&quot;#zt-apply-manager&quot;).addEventListener(&quot;click&quot;, () =&gt; closeManager(true));
      root.querySelector(&quot;#zt-prev-filter&quot;).addEventListener(&quot;click&quot;, () =&gt; stepFilter(-1));
      root.querySelector(&quot;#zt-next-filter&quot;).addEventListener(&quot;click&quot;, () =&gt; stepFilter(1));
      root.querySelector(&quot;#zt-reset-recommended&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        draftVisible = new Set(recommendedNames);
        renderManager();
      });
      search.addEventListener(&quot;input&quot;, renderManager);
      groupCheckbox.addEventListener(&quot;change&quot;, () =&gt; {
        const base = baseCategoryFilters();
        const shouldShow = groupCheckbox.checked;
        base.forEach((item) =&gt; {
          if (shouldShow) draftVisible.add(item.name);
          else draftVisible.delete(item.name);
        });
        renderManager();
      });
      root.querySelectorAll(&quot;.zt-segment&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          statusFilter = button.dataset.status;
          root.querySelectorAll(&quot;.zt-segment&quot;).forEach((peer) =&gt; {
            peer.setAttribute(&quot;aria-pressed&quot;, String(peer === button));
          });
          renderManager();
        });
      });

      if (window.location.hash === &quot;#manager&quot; || new URLSearchParams(window.location.search).has(&quot;manager&quot;)) openManager();
      else renderWorkbench();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
