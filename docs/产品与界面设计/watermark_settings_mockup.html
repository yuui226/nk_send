:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  left: 0;

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

              &lt;div class=&quot;zws-sub&quot;&gt;明暗模式 · 语言 · 按钮风格&lt;/div&gt;
            &lt;/div&gt;
            &lt;span class=&quot;zws-chevron&quot; aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;zws-editor&quot;&gt;
      &lt;header class=&quot;zws-editor-head&quot;&gt;
        &lt;button class=&quot;zws-ghost&quot; type=&quot;button&quot; data-close-editor&gt;‹ 返回&lt;/button&gt;
        &lt;div class=&quot;zws-title&quot;&gt;边框水印&lt;/div&gt;
        &lt;div class=&quot;zws-grow&quot;&gt;&lt;/div&gt;
      &lt;/header&gt;

      &lt;div class=&quot;zws-preview-wrap&quot;&gt;
        &lt;div class=&quot;zws-frame&quot; role=&quot;img&quot; aria-label=&quot;当前边框与水印效果预览&quot;&gt;
          &lt;div class=&quot;zws-photo&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;zws-meta&quot;&gt;
            &lt;div class=&quot;zws-camera&quot;&gt;Nikon Z 8&lt;/div&gt;
            &lt;div class=&quot;zws-exif&quot;&gt;50mm　F2.8　1/250s　ISO100&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;zws-preview-mark&quot; data-preview-mark data-position=&quot;center&quot; data-font=&quot;signature&quot; data-size=&quot;medium&quot;&gt;ZTransfer&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;section class=&quot;zws-editor-section&quot; aria-label=&quot;边框样式&quot;&gt;
        &lt;div class=&quot;zws-row&quot;&gt;
          &lt;div class=&quot;zws-grow&quot;&gt;
            &lt;div class=&quot;zws-label&quot;&gt;边框样式&lt;/div&gt;
            &lt;div class=&quot;zws-sub&quot;&gt;预览与最终导出保持一致&lt;/div&gt;
          &lt;/div&gt;
          &lt;button class=&quot;zws-wheel&quot; type=&quot;button&quot; data-wheel=&quot;frame&quot; aria-label=&quot;切换边框样式&quot;&gt;
            &lt;small&gt;边框&lt;/small&gt;&lt;span data-frame-label&gt;雾白&lt;/span&gt;
          &lt;/button&gt;

      &lt;/section&gt;

      &lt;section class=&quot;zws-editor-section zws-watermark-section&quot; aria-label=&quot;自定义水印&quot;&gt;

          &lt;div class=&quot;zws-grow&quot;&gt;
            &lt;div class=&quot;zws-label&quot;&gt;自定义水印&lt;/div&gt;
            &lt;div class=&quot;zws-sub&quot; data-editor-watermark-summary&gt;ZTransfer&lt;/div&gt;
          &lt;/div&gt;
          &lt;label class=&quot;zws-toggle&quot; aria-label=&quot;显示自定义水印&quot;&gt;
            &lt;input type=&quot;checkbox&quot; data-watermark-enabled checked&gt;
            &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
          &lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;zws-row zws-watermark-controls&quot; data-watermark-controls&gt;
          &lt;div class=&quot;zws-fields&quot;&gt;
            &lt;div class=&quot;zws-field&quot;&gt;
              &lt;label for=&quot;zws-watermark-text&quot;&gt;水印文字&lt;/label&gt;
              &lt;input id=&quot;zws-watermark-text&quot; type=&quot;text&quot; maxlength=&quot;24&quot; size=&quot;11&quot; value=&quot;ZTransfer&quot; data-text-input&gt;
            &lt;/div&gt;
            &lt;div class=&quot;zws-wheels&quot;&gt;
              &lt;button class=&quot;zws-wheel&quot; type=&quot;button&quot; data-wheel=&quot;font&quot;&gt;&lt;small&gt;字型&lt;/small&gt;&lt;span data-font-label&gt;签名&lt;/span&gt;&lt;/button&gt;
              &lt;button class=&quot;zws-wheel&quot; type=&quot;button&quot; data-wheel=&quot;size&quot;&gt;&lt;small&gt;大小&lt;/small&gt;&lt;span data-size-label&gt;中&lt;/span&gt;&lt;/button&gt;
              &lt;button class=&quot;zws-wheel&quot; type=&quot;button&quot; data-wheel=&quot;position&quot;&gt;&lt;small&gt;位置&lt;/small&gt;&lt;span data-position-label&gt;随样式&lt;/span&gt;&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;div class=&quot;zws-actions zws-editor-actions&quot;&gt;
        &lt;button class=&quot;zws-ghost&quot; type=&quot;button&quot; data-reset&gt;恢复默认&lt;/button&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ztransfer-watermark-settings-demo&#x27;);
      const plans = [...root.querySelectorAll(&#x27;[data-plan]&#x27;)];
      const frameButton = root.querySelector(&#x27;[data-wheel=&quot;frame&quot;]&#x27;);
      const frameLabel = root.querySelector(&#x27;[data-frame-label]&#x27;);
      const summary = root.querySelector(&#x27;[data-frame-summary]&#x27;);
      const editorSummary = root.querySelector(&#x27;[data-editor-watermark-summary]&#x27;);
      const frameEnabledInput = root.querySelector(&#x27;[data-frame-enabled]&#x27;);
      const watermarkEnabledInput = root.querySelector(&#x27;[data-watermark-enabled]&#x27;);
      const watermarkControls = root.querySelector(&#x27;[data-watermark-controls]&#x27;);
      const textInput = root.querySelector(&#x27;[data-text-input]&#x27;);
      const previewMark = root.querySelector(&#x27;[data-preview-mark]&#x27;);
      const fontButton = root.querySelector(&#x27;[data-wheel=&quot;font&quot;]&#x27;);
      const sizeButton = root.querySelector(&#x27;[data-wheel=&quot;size&quot;]&#x27;);
      const positionButton = root.querySelector(&#x27;[data-wheel=&quot;position&quot;]&#x27;);
      const fontLabel = root.querySelector(&#x27;[data-font-label]&#x27;);
      const sizeLabel = root.querySelector(&#x27;[data-size-label]&#x27;);
      const positionLabel = root.querySelector(&#x27;[data-position-label]&#x27;);
      const frames = [
        { id: &#x27;mist&#x27;, label: &#x27;雾白&#x27; },
        { id: &#x27;cinema&#x27;, label: &#x27;暗夜&#x27; },
        { id: &#x27;minimal&#x27;, label: &#x27;简白&#x27; },
        { id: &#x27;frosted&#x27;, label: &#x27;磨砂&#x27; },
        { id: &#x27;plaque&#x27;, label: &#x27;铭牌&#x27; }
      ];
      const fonts = [
        { id: &#x27;signature&#x27;, label: &#x27;签名&#x27; },
        { id: &#x27;simple&#x27;, label: &#x27;简约&#x27; },
        { id: &#x27;bold&#x27;, label: &#x27;醒目&#x27; }
      ];
      const sizes = [
        { id: &#x27;small&#x27;, label: &#x27;小&#x27; },
        { id: &#x27;medium&#x27;, label: &#x27;中&#x27; },
        { id: &#x27;large&#x27;, label: &#x27;大&#x27; }
      ];
      const positions = [
        { id: &#x27;auto&#x27;, label: &#x27;随样式&#x27; },
        { id: &#x27;left&#x27;, label: &#x27;左侧&#x27; },
        { id: &#x27;center&#x27;, label: &#x27;居中&#x27; },
        { id: &#x27;right&#x27;, label: &#x27;右侧&#x27; }
      ];
      const state = {
        pro: true,
        frame: 0,
        frameEnabled: true,
        watermarkEnabled: true,
        text: &#x27;ZTransfer&#x27;,
        font: 0,
        size: 1,
        position: 0
      };

      const next = (value, items) =&gt; (value + 1) % items.length;
      const effective = () =&gt; state.pro ? {
        enabled: state.watermarkEnabled,
        text: state.text.trim() || &#x27;ZTransfer&#x27;,
        font: state.font,
        size: state.size,
        position: state.position
      } : { enabled: true, text: &#x27;ZTransfer&#x27;, font: 0, size: 1, position: 0 };

      function render() {
        const shown = effective();
        const frame = frames[state.frame];
        const autoPosition = frame.id === &#x27;plaque&#x27; ? &#x27;left&#x27; : &#x27;center&#x27;;
        const markPosition = positions[shown.position].id === &#x27;auto&#x27; ? autoPosition : positions[shown.position].id;
        root.dataset.frame = frame.id;
        root.classList.toggle(&#x27;zws-free&#x27;, !state.pro);
        root.classList.toggle(&#x27;zws-frame-off&#x27;, !state.frameEnabled);
        plans.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String((button.dataset.plan === &#x27;pro&#x27;) === state.pro)));
        frameLabel.textContent = frame.label;
        summary.textContent = `${frame.label} · ${shown.enabled ? shown.text : &#x27;无水印&#x27;}`;
        editorSummary.textContent = shown.enabled ? shown.text : &#x27;无水印&#x27;;
        frameEnabledInput.checked = state.frameEnabled;
        watermarkEnabledInput.checked = shown.enabled;
        watermarkEnabledInput.disabled = !state.pro;
        watermarkControls.hidden = !shown.enabled;
        textInput.value = shown.text;
        textInput.disabled = !state.pro;
        textInput.size = Math.min(24, Math.max(11, [...shown.text].length + 2));
        fontButton.disabled = !state.pro;
        sizeButton.disabled = !state.pro;
        positionButton.disabled = !state.pro;
        fontLabel.textContent = fonts[shown.font].label;
        sizeLabel.textContent = sizes[shown.size].label;
        positionLabel.textContent = positions[shown.position].label;
        previewMark.textContent = shown.text;
        previewMark.hidden = !shown.enabled;
        previewMark.dataset.font = fonts[shown.font].id;
        previewMark.dataset.size = sizes[shown.size].id;
        previewMark.dataset.position = markPosition;
      }

      plans.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.pro = button.dataset.plan === &#x27;pro&#x27;;
        render();
      }));
      frameButton.addEventListener(&#x27;click&#x27;, () =&gt; { state.frame = next(state.frame, frames); render(); });
      frameEnabledInput.addEventListener(&#x27;change&#x27;, () =&gt; { state.frameEnabled = frameEnabledInput.checked; render(); });
      root.querySelector(&#x27;[data-open-editor]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.classList.add(&#x27;zws-editing&#x27;); render(); });
      root.querySelector(&#x27;[data-close-editor]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.classList.remove(&#x27;zws-editing&#x27;));
      root.querySelector(&#x27;[data-done]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.classList.remove(&#x27;zws-editing&#x27;));
      watermarkEnabledInput.addEventListener(&#x27;change&#x27;, () =&gt; { if (state.pro) state.watermarkEnabled = watermarkEnabledInput.checked; render(); });
      textInput.addEventListener(&#x27;input&#x27;, () =&gt; { if (state.pro) state.text = textInput.value; render(); });
      fontButton.addEventListener(&#x27;click&#x27;, () =&gt; { if (state.pro &amp;&amp; state.watermarkEnabled) state.font = next(state.font, fonts); render(); });
      sizeButton.addEventListener(&#x27;click&#x27;, () =&gt; { if (state.pro &amp;&amp; state.watermarkEnabled) state.size = next(state.size, sizes); render(); });
      positionButton.addEventListener(&#x27;click&#x27;, () =&gt; { if (state.pro &amp;&amp; state.watermarkEnabled) state.position = next(state.position, positions); render(); });
      root.querySelector(&#x27;[data-reset]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state.frame = 0;
        state.frameEnabled = true;
        state.watermarkEnabled = true;
        state.text = &#x27;ZTransfer&#x27;;
        state.font = 0;
        state.size = 1;
        state.position = 0;
        render();
      });
      root.querySelectorAll(&#x27;.zws-mini&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.zws-mini&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer === button)));
      }));
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
