org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# TEMP: Android + Harmony transfer-corruption investigation (Debug and Release).
# Remove this line after field testing to disable all diagnostic readbacks/re-reads.
# Does not enable the Harmony storage workaround on ordinary Android devices.
transferCorruptionDiagnostic=true

# Network settings
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000
