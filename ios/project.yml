    resources:
      - path: ZTransfer/Resources
      - path: licenses
    info:
      path: ZTransfer/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Z传
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationCategoryType: public.app-category.photography
        NSLocationWhenInUseUsageDescription: 用于向相机写入拍摄位置
        NSLocationAlwaysAndWhenInUseUsageDescription: 用于在后台持续向相机写入拍摄位置
        UIBackgroundModes:
          - location
        NSBluetoothAlwaysUsageDescription: 用于连接 Nikon GPS 设备
        NSCameraUsageDescription: 用于通过 USB 连接相机、浏览和传输照片并控制拍摄
        NSPhotoLibraryUsageDescription: 用于读取工作台照片
        NSPhotoLibraryAddUsageDescription: 用于保存工作台生成的效果图
        NSLocalNetworkUsageDescription: 用于连接相机
        NSBonjourServices:
          - _ptp._tcp
          - _nikon._tcp
        UIAppFonts:
          - great_vibes_regular.ttf
          - bebas_neue_regular.ttf
          - cormorant_garamond_medium_italic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UILaunchScreen: {}
    entitlements:
      path: ZTransfer/ZTransfer.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    frameworks:
      - ImageCaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztransfer.ios
        MARKETING_VERSION: "1.91"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Z传
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用于向相机写入拍摄位置"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "用于连接 Nikon GPS 设备"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于通过 USB 连接相机、浏览和传输照片并控制拍摄"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用于读取工作台照片"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于保存工作台生成的效果图"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于连接相机"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/libjpeg-8bit/src"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ZTransfer/ZTransfer.entitlements
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": StoreKit/SimulatorDebug.entitlements
    scheme:
      testTargets:
        - ZTransferTests
  ZTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZTransferTests
      - path: ProtocolTests
      - path: EffectsTests
      - path: RemoteTests
      - path: GPSTests
    dependencies:
      - target: ZTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztransfer.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZTransfer.app/ZTransfer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  ZTransferStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoreKitTests
      - path: StoreKit/ZTransfer.storekit
        buildPhase: resources
    dependencies:
      - target: ZTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztransfer.ios.storekittests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZTransfer.app/ZTransfer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  ZTransferStoreKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StoreKitUITests
      - path: StoreKit/ZTransfer.storekit
        buildPhase: resources
    dependencies:
      - target: ZTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztransfer.ios.storekituitests
        TEST_TARGET_NAME: ZTransfer
        GENERATE_INFOPLIST_FILE: YES
  ZTransferInteractionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InteractionUITests
    dependencies:
      - target: ZTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztransfer.ios.interactionuitests
        TEST_TARGET_NAME: ZTransfer
        GENERATE_INFOPLIST_FILE: YES
