name: ZTransfer
options:
  bundleIdPrefix: com.ztransfer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
fileGroups:
  - StoreKit
schemes:
  ZTransfer-Interactions:
    build:
      targets:
        ZTransfer: all
    test:
      config: Debug
      targets:
        - ZTransferTests
        - ZTransferInteractionUITests
  ZTransfer-StoreKit:
    build:
      targets:
        ZTransfer: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ZTransfer.storekit
    test:
      config: Debug
      targets:
        - ZTransferStoreKitTests
  ZTransfer-StoreKitUI:
    build:
      targets:
        ZTransfer: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ZTransfer.storekit
    test:
      config: Debug
      targets:
        - ZTransferStoreKitUITests
targets:
  ZTransfer:
    type: application
    platform: iOS
    sources:
